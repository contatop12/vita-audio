    <!--
      A imagem do hero entra por background-image inline, que o browser só
      descobre depois de baixar e aplicar o CSS. O preload antecipa esse

    -->

      rel="preload"

      href="%BASE_URL%images/hero-section-audi-mobile-v1.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />

    <!--
      Só os pesos realmente usados: Poppins 400/500/600/700 e Playfair 600
      (aplicado em um único h2). A folha carrega sem bloquear o render — com
      display=swap o texto já apareceria na fonte de fallback de qualquer forma,
      então bloquear a primeira pintura não traria ganho nenhum.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600;700&display=swap"
